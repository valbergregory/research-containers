# Publica ghcr.io/valbergregory/jurimetrics-py:{3.12, latest} — ambiente Python dos artigos Python-only.
name: Publish jurimetrics-py

on:
  push:
    branches: [main]
    paths: ["jurimetrics-py/**", ".github/workflows/publish-jurimetrics-py.yml"]
  schedule:
    - cron: "0 6 1 * *"   # rebuild mensal (segurança do SO base)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PY_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: jurimetrics-py
          build-args: PY_VERSION=${{ env.PY_VERSION }}
          push: true
          tags: |
            ghcr.io/valbergregory/jurimetrics-py:${{ env.PY_VERSION }}
            ghcr.io/valbergregory/jurimetrics-py:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
